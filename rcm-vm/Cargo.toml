[package]
name = "rcm-vm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RCM VM — JavaScript runtime execution engine for RCM menus"
authors = ["ahaoboy"]

[features]
default = ["llrt"]
# Extend the rquickjs engine with Node modules (fs/path/url/os) for menu scripts.
llrt = ["dep:llrt_modules"]
# Swap the engine for the full Deno runtime (V8 + node:fs/os/path/...).
# Mutually exclusive with `llrt`.

# FIXME: https://github.com/denoland/deno/issues/36975
deno = []
# deno = [
#     "dep:deno_runtime",
#     "dep:deno_core",
#     "dep:deno_fs",
#     "dep:deno_permissions",
#     "dep:deno_resolver",
#     "dep:sys_traits",
#     "dep:tokio",
# ]

[dependencies]
rcm-core = { path = "../rcm-core", version = "0.1" }
rcm-com = { workspace = true }
rquickjs = { workspace = true, features = ["loader"] }
serde = { workspace = true }
serde_json = { workspace = true }
is-admin = { workspace = true }
llrt_modules = { workspace = true, optional = true }
deno_core = { workspace = true, optional = true }
deno_runtime = { workspace = true, optional = true }
deno_fs = { workspace = true, optional = true }
deno_permissions = { workspace = true, optional = true }
deno_resolver = { workspace = true, optional = true }
sys_traits = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
