[workspace]
members = ["src-tauri", "rcm-core", "rcm-vm"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true

[workspace.dependencies]
# ── Serde ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── System utilities ───────────────────────────────────────────────────
which = "8"
trash = "5"
clipboard-rs = "0.3"
base64 = "0.22"
winreg = "0.56"
anyhow = "1"
tokio = "1"
clap = { version = "4", features = ["derive"] }

# ── Windows APIs ──────────────────────────────────────────────────────
# pin 0.61
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Management_Deployment",
  "ApplicationModel",
  "Graphics",
  "Win32_System_SystemInformation",
] }

# ── Slint (native UI) ──────────────────────────────────────────────────
slint = "1.14"
slint-build = "1.14"

# ── Tray icon (cross-platform system tray) ─────────────────────────────
tray-icon = "0.24"

# ── Tauri ──────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rcm-reg = { git = "https://github.com/ahaoboy/rcm-reg", version = "0.1" }

# ── Git dependencies ──────────────────────────────────────────────────
rcm-com = { version = "0.1", git = "https://github.com/ahaoboy/rcm-com.git" }
easy-archive = { git = "https://github.com/ahaoboy/easy-archive", features = [
  "encode",
  "decode",
  "cli",
] }

# rquickjs = { git = "https://github.com/DelSkayn/rquickjs", default-features = false, version = "0.12" }
rquickjs = { default-features = false, version = "0.12" }
llrt_modules = { git = "https://github.com/awslabs/llrt" }

