[workspace]
members = ["rcm-tauri", "rcm-core", "rcm-vm"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true

[workspace.dependencies]
# ── Serde ──────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# ── System utilities ───────────────────────────────────────────────────
which = "8"
trash = "5"
remove_dir_all = { version = "1", features = ["parallel", "log"] }
clipboard-rs = "0.3"
base64 = "0.23"
winreg = "0.56"
tokio = "1"
regex = "1"
ureq = "3"
autorun = { version = "0.1", git = "https://github.com/ahaoboy/autorun", default-features = false, features = [
  "serde",
] }
is-admin = "0.1"
quick-access = { version = "0.1", git = "https://github.com/ahaoboy/quick-access", default-features = false, features = [
  "serde",
] }

# ── Windows APIs ──────────────────────────────────────────────────────
# pin 0.61
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Management_Deployment",
  "ApplicationModel",
  "Graphics",
  "Win32_System_SystemInformation",
] }

# ── Tray icon (cross-platform system tray) ─────────────────────────────
cmdexpand = "0.3"
dirs = "7"

# ── Tauri ──────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rcm-reg = { git = "https://github.com/ahaoboy/rcm-reg", version = "0.1" }
lnk-com = { git = "https://github.com/ahaoboy/lnk-com", default-features = false, version = "0.1" }
desktop-com = { git = "https://github.com/ahaoboy/desktop-com", default-features = false, version = "0.1" }
startmenu = { git = "https://github.com/ahaoboy/startmenu", default-features = false, version = "0.1", features = [
  "serde",
] }
upath = { git = "https://github.com/ahaoboy/upath", default-features = false, version = "0.1" }

# ── Git dependencies ──────────────────────────────────────────────────
rcm-com = { version = "0.1", git = "https://github.com/ahaoboy/rcm-com.git" }
easy-archive = { version = "0.2", git = "https://github.com/ahaoboy/easy-archive", features = [
  "encode",
  "decode",
  "cli",
  "fmt",
] }

# rquickjs = { git = "https://github.com/DelSkayn/rquickjs", default-features = false, version = "0.14" }
rquickjs = { default-features = false, version = "0.14" }
# ── Deno engine ────────────────────────────────────────────────────────
# `deno_runtime` is the full Deno runtime. It depends on `deno_core` with
# `default-features = false`, which leaves the `v8` backend off, so `deno_core`
# is also listed here purely to switch that feature on.
deno_core = "0.412"
deno_runtime = { version = "0.267", features = ["transpile"] }
deno_fs = "0.169"
deno_permissions = "0.118"
deno_resolver = "0.90"
# `feature = "real"` is what provides `impls::RealSys`; none of the deno crates
# turn it on for their normal dependencies.
sys_traits = { version = "0.1", features = ["real"] }
llrt_modules = { git = "https://github.com/awslabs/llrt", version = "0.9.0-beta" }
rcm-core = { path = "./rcm-core", version = "0.1" }
rcm-vm = { path = "./rcm-vm", version = "0.1" }
git-version = "0.3"
